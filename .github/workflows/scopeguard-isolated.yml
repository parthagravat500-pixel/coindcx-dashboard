name: ScopeGuard isolated tests

on:
  push:
    branches: [scopeguard-app]
    paths:
      - '*.py'
      - 'ci/**'
      - 'index.html'
      - 'ui.js'
      - '.github/workflows/scopeguard-isolated.yml'

# Never alter or run the unrelated trading application on main.
# No schedule: GitHub schedules execute from the default branch (main).
# No paid models, larger runners, artifact uploads, caches, or deployment secrets.
permissions:
  contents: read

concurrency:
  group: scopeguard-isolated-tests
  cancel-in-progress: true

jobs:
  isolated-regression:
    if: github.repository == 'parthagravat500-pixel/coindcx-dashboard' && github.ref == 'refs/heads/scopeguard-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out this exact ScopeGuard commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build credential-free test image
        run: docker build --pull --file ci/Dockerfile --tag scopeguard-isolated-test .

      - name: Run isolated owned-code tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s docker run --rm \
            --name scopeguard-ci-tests \
            --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges=true \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            scopeguard-isolated-test

      - name: Remove this job's test container if interrupted
        if: always()
        run: docker rm --force scopeguard-ci-tests >/dev/null 2>&1 || true

      - name: Explain coverage
        if: always()
        env:
          TEST_JOB_STATUS: ${{ job.status }}
        run: |
          printf '## ScopeGuard isolated tests\n\nJob status: %s\n\n' "$TEST_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The test step checks isolation before running the regression suite.' 'Coverage: owned ScopeGuard code, loopback HTTP, and synthetic fixtures only.' 'No external targets, production credentials, paid AI calls, or confirmed bounty bugs.' 'This is change-triggered CI, not a 24-hour hunting worker or a general hostile-code sandbox.' >> "$GITHUB_STEP_SUMMARY"
