services:
  scopeguard:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique password of at least 24 characters in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - scopeguard-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
volumes:
  scopeguard-data:
