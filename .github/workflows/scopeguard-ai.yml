name: ScopeGuard private local-model review

on:
  push:
    branches: [scopeguard-app]
    paths:
      - 'app.py'
      - 'ci_identity.py'
      - 'ci/ai*'
      - '.github/workflows/scopeguard-ai.yml'

# Standard public-repository runner only. No paid API, artifacts, cache, cron,
# secrets, main-branch changes, external targets or generated-code execution.
permissions:
  contents: read
  id-token: write

concurrency:
  group: scopeguard-private-ai
  cancel-in-progress: false

jobs:
  private-review:
    if: github.repository == 'parthagravat500-pixel/coindcx-dashboard' && github.ref == 'refs/heads/scopeguard-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact owned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Request private review lease
        id: lease
        run: python3 ci/ai_bridge.py start

      - name: Prepare bounded source excerpts
        if: steps.lease.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          scopeguard_job_dir=$(mktemp -d "$RUNNER_TEMP/scopeguard-ai.XXXXXX")
          chmod 755 "$scopeguard_job_dir"
          mkdir "$scopeguard_job_dir/input" "$scopeguard_job_dir/output" "$scopeguard_job_dir/build"
          sudo chown 65532:65532 "$scopeguard_job_dir/output"
          chmod 700 "$scopeguard_job_dir/output"
          python3 ci/ai_bridge.py prepare "$scopeguard_job_dir/input/excerpts.json"
          cp ci/ai_review.py ci/isolated_checks.py "$scopeguard_job_dir/build/"
          printf 'SCOPEGUARD_JOB_DIR=%s\n' "$scopeguard_job_dir" >> "$GITHUB_ENV"

      - name: Download and verify official CPU runner and model
        if: steps.lease.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 240 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11168/llama-b11168-bin-ubuntu-x64.tar.gz \
            -o "$SCOPEGUARD_JOB_DIR/build/llama.tar.gz"
          printf '8586c739677a1952218330fd37a5b433f9a0ac55b998f5de131de0d7286985a0  %s\n' "$SCOPEGUARD_JOB_DIR/build/llama.tar.gz" | sha256sum --check
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 360 \
            https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            -o "$SCOPEGUARD_JOB_DIR/model.gguf"
          printf '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  %s\n' "$SCOPEGUARD_JOB_DIR/model.gguf" | sha256sum --check
          docker build --file ci/ai.Dockerfile --tag scopeguard-private-ai "$SCOPEGUARD_JOB_DIR/build"

      - name: Review offline in isolated container
        if: steps.lease.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1000s docker run --rm --name scopeguard-private-ai-run \
            --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges=true --cpus 2 --memory 10g --memory-swap 10g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,source=$SCOPEGUARD_JOB_DIR/model.gguf,target=/model.gguf,readonly" \
            --mount "type=bind,source=$SCOPEGUARD_JOB_DIR/input,target=/input,readonly" \
            --mount "type=bind,source=$SCOPEGUARD_JOB_DIR/output,target=/output" \
            scopeguard-private-ai

      - name: Return analysis privately to the dashboard
        if: always() && steps.lease.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SCOPEGUARD_JOB_DIR:-}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SCOPEGUARD_JOB_DIR/output"
            python3 ci/ai_bridge.py result "$SCOPEGUARD_JOB_DIR/output/result.json"
          fi

      - name: Clean up this job's container
        if: always()
        run: docker rm --force scopeguard-private-ai-run >/dev/null 2>&1 || true

      - name: Public summary without private analysis
        if: always()
        run: |
          printf '%s\n' '## Experimental private local-model review' 'Model: Qwen2.5-Coder-7B-Instruct Q4_K_M (Apache-2.0).' 'At most two owned-code excerpts; synthetic calibration, not an expert benchmark.' 'Analysis is delivered only to the authenticated ScopeGuard dashboard.' 'No artifacts, paid model calls, external targets, generated execution or automatic bounty reports.' >> "$GITHUB_STEP_SUMMARY"
